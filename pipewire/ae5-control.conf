# PipeWire/ACP-Profil nur für die Sound BlasterX AE-5 (per udev zugewiesen).
#
# Warum: Die Standard-Vorlage "Kopfhörer" schaltet den Kanal "Front" stumm. Bei der
# AE-5 läuft der Kopfhörer aber über genau diesen Kanal; umgeschaltet wird nur mit
# "Output Select". Diese Vorlage kennt deshalb zwei eigene Ausgänge:
#   ae5-output-headphones  Front an, Output Select = Headphone, Buchse "Headphone"
#   ae5-output-speakers    Output Select = Speakers, Buchse "Line Out Front"

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = ae5-output-headphones ae5-output-speakers
paths-input = analog-input-mic analog-input-linein
priority = 15

[Mapping analog-surround-51]
device-strings = surround51:%f
channel-map = front-left,front-right,rear-left,rear-right,front-center,lfe
paths-output = ae5-output-speakers
priority = 13
direction = output

[Mapping iec958-stereo]
device-strings = iec958:%f
channel-map = left,right
paths-output = iec958-stereo-output
priority = 5
direction = output
