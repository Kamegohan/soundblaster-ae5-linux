# WirePlumber: Die AE-5 nie in den Ruhezustand schicken.
# Grund: Nach dem Ruhezustand (Ausgabe geschlossen und wieder geöffnet) bleibt der
# Kopfhörerverstärker der AE-5 aus – die Karte nimmt Daten an, aber es ist still.
monitor.alsa.rules = [
  {
    matches = [
      { media.class = "Audio/Sink", alsa.components = "~HDA:11020011,11020191.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
