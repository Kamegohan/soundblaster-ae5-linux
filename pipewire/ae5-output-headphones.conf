# AE-5 Kopfhörerausgang (Buchse mit eigenem Verstärker).
# Anders als die Standard-Vorlage bleibt "Front" AN – darüber läuft der Kopfhörer.

[General]
priority = 100
description-key = analog-output-headphones

[Jack Headphone]
required-any = any

[Element Master]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element PCM]
volume = ignore

[Element Front]
switch = on
volume = zero

[Element Surround]
switch = off
volume = off

[Element Center]
switch = off
volume = off

[Element LFE]
switch = off
volume = off

[Element Output Select]
enumeration = select

[Option Output Select:Headphone]
name = output-headphones
priority = 10
