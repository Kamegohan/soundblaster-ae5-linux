# AE-5 Lautsprecher (Line-Out-Buchsen auf der Rückseite).

[General]
priority = 90
description-key = analog-output-lineout

[Jack Line Out Front]
required-any = any

[Element Master]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element PCM]
volume = ignore

[Element Front]
switch = mute
volume = zero

[Element Surround]
switch = mute
volume = zero

[Element Center]
switch = mute
volume = zero

[Element LFE]
switch = mute
volume = zero

[Element Output Select]
enumeration = select

[Option Output Select:Speakers]
name = output-speaker
priority = 10
